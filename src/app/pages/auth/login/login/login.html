<div class="min-h-screen flex flex-col bg-[var(--bg-base)]" dir="rtl">

  <header class="sticky top-0 z-50 border-b border-[var(--border)] bg-[var(--bg-card)]/90 backdrop-blur-md">
    <div class="mx-auto flex h-[56px] max-w-[1280px] items-center justify-between px-4 sm:px-6 lg:px-8">
      <a routerLink="/welcome" class="flex items-center gap-2 no-underline">
        <img src="/assets/companyLogo.png" alt="شعار تفية" class="h-8 w-8 object-contain">
        <span class="text-[16px] font-extrabold tracking-tight text-[var(--text-primary)]">تفية</span>
      </a>
      <div class="flex items-center gap-2">
        <a href="#" target="_blank" rel="noopener" class="hidden sm:inline-flex h-[32px] items-center rounded-full border border-[var(--border)] bg-white px-3 text-[12px] font-semibold text-[var(--text-primary)] transition hover:border-[var(--primary)]/20 hover:bg-[var(--primary-light)]/20">
          اندرويد
        </a>
        <a href="#" target="_blank" rel="noopener" class="hidden sm:inline-flex h-[32px] items-center rounded-full border border-[var(--border)] bg-white px-3 text-[12px] font-semibold text-[var(--text-primary)] transition hover:border-[var(--primary)]/20 hover:bg-[var(--primary-light)]/20">
          ايفون
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <section aria-labelledby="login-title" class="rounded-2xl border
                  border-[var(--border)]
                  bg-[var(--bg-card)]
                  shadow-[0_4px_24px_var(--shadow)]
                  p-6 md:p-8">

        <h2 id="login-title" class="text-sm md:text-lg font-bold
                   text-[var(--text-primary)]
                   mb-6 text-center">
          تسجيل الدخول
        </h2>

        <form [formGroup]="form"
              (ngSubmit)="onSubmit()"
              class="flex flex-col gap-5">

          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-[12px] font-semibold
                          text-[var(--text-primary)]">
              البريد الإلكتروني
            </label>
            <div class="relative">
              <input
                id="email"
                formControlName="email"
                type="email"
                placeholder="example@company.com"
                class="w-full h-[44px] px-4
                       rounded-xl border
                       border-[var(--border)]
                       bg-[var(--bg-base)]
                       text-[var(--text-primary)]
                       text-sm placeholder:text-[var(--text-muted)]
                       focus:outline-none
                       focus:border-[var(--primary)]
                       focus:ring-2
                       focus:ring-[var(--primary)]/20
                       transition-all duration-150">
              <div class="absolute top-1/2 right-3
                          -translate-y-1/2
                          text-[var(--text-muted)]">
                <svg lucideMail class="w-4 h-4" aria-hidden="true"></svg>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="password" class="text-[12px] font-semibold
                          text-[var(--text-primary)]">
              كلمة المرور
            </label>
            <div class="relative">
              <input
                id="password"
                formControlName="password"
                [type]="showPassword() ? 'text' : 'password'"
                placeholder="••••••••"
                class="w-full h-[44px] px-4
                       rounded-xl border
                       border-[var(--border)]
                       bg-[var(--bg-base)]
                       text-[var(--text-primary)]
                       text-sm placeholder:text-[var(--text-muted)]
                       focus:outline-none
                       focus:border-[var(--primary)]
                       focus:ring-2
                       focus:ring-[var(--primary)]/20
                       transition-all duration-150">
              <div class="absolute top-1/2 right-3
                          -translate-y-1/2
                          text-[var(--text-muted)]">
                <svg lucideLock class="w-4 h-4" aria-hidden="true"></svg>
              </div>
              <button
                type="button"
                [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
                (click)="showPassword.update(v => !v)"
                class="absolute top-1/2 left-3
                       -translate-y-1/2
                       text-[var(--text-muted)]
                       hover:text-[var(--primary)]
                       transition-colors">
                <svg lucideEye class="w-4 h-4" aria-hidden="true"></svg>
              </button>
            </div>
          </div>

          @if (errorMessage()) {
            <div class="flex items-center gap-2
                        px-4 py-3 rounded-xl
                        bg-red-50 border border-red-200">
              <svg lucideAlertCircle class="w-4 h-4 text-red-500 flex-shrink-0" aria-hidden="true"></svg>
              <span class="text-sm text-red-600">
                {{ errorMessage() }}
              </span>
            </div>
          }

          <button
            type="submit"
            [disabled]="isLoading() || form.invalid"
            class="w-full h-[52px] px-4 rounded-xl
                   bg-[var(--primary)] text-white
                   text-[15px] font-bold
                   flex items-center justify-center
                   gap-2
                   hover:bg-[var(--primary-hover)]
                   active:scale-[0.98]
                   disabled:opacity-50
                   disabled:cursor-not-allowed
                   transition-all duration-150">
            @if (isLoading()) {
              <svg lucideLoaderCircle class="w-4 h-4 animate-spin" aria-hidden="true"></svg>
              <span>جاري تسجيل الدخول...</span>
            } @else {
              <svg lucideLogIn class="w-4 h-4" aria-hidden="true"></svg>
              <span>تسجيل الدخول</span>
            }
          </button>

        </form>

      </section>

      <p class="text-center text-xs text-[var(--text-muted)] mt-6">
        تفية — منصة حجز التذاكر في السودان
      </p>

    </div>
  </main>

</div>
